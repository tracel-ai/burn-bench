[package]
authors = ["Tracel Technologies Inc."]
categories = ["science"]
description = "This crate is used to time the execution of various computations, from operation kernels to complex model scenarios."
edition.workspace = true
license.workspace = true
name = "backend-comparison"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn-bench/tree/main/backend-comparison"
version = "0.1.0"

# Two orthogonal concerns are kept separate:
#
# * Backend (the *device*) is a compile-time choice expressed as a cargo
#   feature (`wgpu`, `cuda`, ...). The runner enables the right backend
#   feature(s) for the requested `--devices` (see `run_cargo` in burnbench):
#   by default it links the full set valid on the host so any device can be
#   selected at runtime without recompiling, but `--fast` links only the
#   backend(s) actually requested for quicker iteration.
#
# * Framework decorators (`fusion`, `autotune`) are compile-time, so each
#   combination is a separate build. They are default-on features that the
#   runner toggles through `--build` profiles (e.g. `no-fusion`). `std` is not
#   toggleable here: the GPU backends require it.
#
# Backend features are intentionally *not* in `default`: the `--build` profiles
# pass `--no-default-features` to drop `fusion`, and the backends must survive
# that, so the runner always re-adds them explicitly.
[features]
default = ["fusion", "autotune"]

# Compile-time framework decorators, toggled via `--build` profiles.
fusion = ["burn/fusion"]
autotune = ["burn/autotune"]

# Backends. The runner enables these based on `--devices` (and `--fast`).
# `tch` depends on an external libtorch and `rocm` links directly, so neither is
# part of the default set; both are only enabled when explicitly requested.
wgpu = ["burn/wgpu"]
webgpu = ["burn/webgpu"]
cpu = ["burn/cpu"]
flex = ["burn/flex"]
ndarray = ["burn/ndarray"]
vulkan = ["burn/vulkan"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]
rocm = ["burn/rocm"]
tch = ["burn/tch"]

ndarray-simd = ["burn/simd"]
ndarray-blas-accelerate = ["burn/accelerate"]
ndarray-blas-netlib = ["burn/blas-netlib"]
ndarray-blas-openblas = ["burn/openblas"]

# Special benchmark capabilities.
multi-device = []
remote = ["server", "burn/remote"]
server = ["burn/server"]

correctness = []

[dependencies]
# Backends are enabled through the cargo features above, which the runner turns
# on per `--devices`. Only the always-needed bits are listed here; `fusion`/
# `autotune` are toggleable `--build` features and are pulled in via `default`.
burn = { git = "https://github.com/tracel-ai/burn", branch = "main", default-features = false, features = [
    "std",
    "autodiff",
] }

burnbench = { path = "../burnbench" }

arboard = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
comfy-table = { workspace = true }
derive-new = { workspace = true }
dirs = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
os_info = { workspace = true }
percent-encoding = { workspace = true }
phf = { workspace = true }
rand = { version = "0.10.0" }                                # pull the same version as burn
regex = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
strum = { workspace = true, features = ["derive"] }
sysinfo = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }
wsl = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
serial_test = { workspace = true }

[build-dependencies]
semver = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }

